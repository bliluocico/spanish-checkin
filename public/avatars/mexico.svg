<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 墨西哥城：阿兹特克太阳石 -->
  <!-- 外圈 -->
  <circle cx="50" cy="50" r="38" fill="#1A1A1A"/>
  <!-- 第二圈刻线 -->
  <circle cx="50" cy="50" r="32" stroke="#B0572A" stroke-width="1.4" fill="none"/>
  <!-- 第三圈刻线 -->
  <circle cx="50" cy="50" r="22" stroke="#B0572A" stroke-width="1.2" fill="none"/>
  <!-- 中心 -->
  <circle cx="50" cy="50" r="7" fill="#B0572A"/>
  <!-- 四向放射粗线（方位） -->
  <g stroke="#B0572A" stroke-width="2.4" stroke-linecap="round">
    <line x1="50" y1="12" x2="50" y2="22"/>
    <line x1="50" y1="78" x2="50" y2="88"/>
    <line x1="12" y1="50" x2="22" y2="50"/>
    <line x1="78" y1="50" x2="88" y2="50"/>
  </g>
  <!-- 斜向细放射 -->
  <g stroke="#B0572A" stroke-width="1.4" stroke-linecap="round" opacity="0.85">
    <line x1="23" y1="23" x2="29" y2="29"/>
    <line x1="77" y1="23" x2="71" y2="29"/>
    <line x1="23" y1="77" x2="29" y2="71"/>
    <line x1="77" y1="77" x2="71" y2="71"/>
  </g>
  <!-- 中心面孔刻线 -->
  <line x1="50" y1="46" x2="50" y2="56" stroke="#1A1A1A" stroke-width="1.4"/>
  <path d="M45 52 Q50 54 55 52" stroke="#1A1A1A" stroke-width="1.2" fill="none"/>
</svg>