<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 塞维利亚：吉拉尔达塔 + 橙子 -->
  <!-- 塔身 -->
  <rect x="40" y="20" width="20" height="64" fill="#1A1A1A"/>
  <!-- 塔顶收窄 -->
  <rect x="44" y="14" width="12" height="6" fill="#1A1A1A"/>
  <!-- 风向标杆 -->
  <line x1="50" y1="14" x2="50" y2="4" stroke="#1A1A1A" stroke-width="2"/>
  <!-- 风向旗帜 -->
  <path d="M50 6 Q58 4 62 8 L58 12 Q54 10 50 12 Z" fill="#1A1A1A"/>
  <!-- 塔身窗格刻线 -->
  <rect x="46" y="38" width="8" height="12" stroke="#B0572A" stroke-width="1.2" fill="none"/>
  <rect x="46" y="60" width="8" height="12" stroke="#B0572A" stroke-width="1.2" fill="none"/>
  <line x1="50" y1="22" x2="50" y2="84" stroke="#B0572A" stroke-width="0.9" opacity="0.7"/>
  <!-- 橙子（左下） -->
  <circle cx="22" cy="80" r="11" fill="#1A1A1A"/>
  <!-- 橙子叶 -->
  <path d="M22 69 L19 64 L25 64 Z" fill="#1A1A1A"/>
  <!-- 橙子刻线分瓣 -->
  <path d="M22 72 L22 88 M12 80 L32 80" stroke="#B0572A" stroke-width="1" opacity="0.7"/>
</svg>