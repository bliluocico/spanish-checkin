<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 马德里：熊与树 -->
  <!-- 树干 -->
  <path d="M62 14 Q60 14 60 18 L60 86 Q60 88 62 88 L68 88 Q70 88 70 86 L70 18 Q70 14 68 14 Z" fill="#1A1A1A"/>
  <!-- 树冠（几片叶） -->
  <ellipse cx="66" cy="16" rx="9" ry="6" fill="#1A1A1A"/>
  <!-- 熊剪影（攀树） -->
  <ellipse cx="36" cy="60" rx="13" ry="16" fill="#1A1A1A"/>
  <!-- 熊头 -->
  <circle cx="30" cy="44" r="8" fill="#1A1A1A"/>
  <!-- 熊耳 -->
  <circle cx="26" cy="38" r="2.5" fill="#1A1A1A"/>
  <circle cx="34" cy="38" r="2.5" fill="#1A1A1A"/>
  <!-- 熊抱树的爪 -->
  <path d="M44 50 Q54 50 60 56 M44 64 Q56 64 60 70" stroke="#1A1A1A" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- 熊眼刻线 -->
  <circle cx="28" cy="44" r="0.9" fill="#B0572A"/>
  <!-- 树皮刻线 -->
  <line x1="65" y1="30" x2="65" y2="80" stroke="#B0572A" stroke-width="1" opacity="0.7"/>
</svg>