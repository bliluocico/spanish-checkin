<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 波哥大：安第斯山 + 咖啡叶 -->
  <!-- 三座山峦剪影 -->
  <path d="M8 70 L26 38 L44 70 Z" fill="#1A1A1A"/>
  <path d="M30 70 L50 28 L70 70 Z" fill="#1A1A1A"/>
  <path d="M56 70 L74 40 L92 70 Z" fill="#1A1A1A"/>
  <!-- 雪冠（用陶土色刻线表示） -->
  <path d="M22 44 L26 38 L30 44 M46 34 L50 28 L54 34 M70 46 L74 40 L78 46" stroke="#B0572A" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <!-- 山脚地平线 -->
  <line x1="6" y1="70" x2="94" y2="70" stroke="#1A1A1A" stroke-width="2.4" stroke-linecap="round"/>
  <!-- 咖啡叶（前景） -->
  <path d="M30 86 Q24 80 26 70 Q34 74 36 84 Z" fill="#1A1A1A"/>
  <path d="M70 86 Q76 80 74 70 Q66 74 64 84 Z" fill="#1A1A1A"/>
  <!-- 叶脉刻线 -->
  <path d="M28 84 L34 76 M68 84 L72 76" stroke="#B0572A" stroke-width="1" fill="none" opacity="0.8"/>
  <!-- 咖啡果 -->
  <circle cx="30" cy="86" r="1.8" fill="#B0572A"/>
  <circle cx="70" cy="86" r="1.8" fill="#B0572A"/>
</svg>