<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 阿喀琉斯：科林斯头盔 + 长矛 -->
  <!-- 矛杆 -->
  <line x1="78" y1="92" x2="60" y2="14" stroke="#1A1A1A" stroke-width="3.2" stroke-linecap="round"/>
  <!-- 矛头 -->
  <path d="M60 14 L57 8 L62 6 L63 16 Z" fill="#1A1A1A"/>
  <!-- 头盔主体（剪影） -->
  <path d="M28 60 Q26 36 44 28 Q60 24 66 34 Q70 44 68 56 L66 70 Q56 74 44 72 Q34 70 30 68 Z" fill="#1A1A1A"/>
  <!-- 头盔羽冠 -->
  <path d="M44 28 Q40 18 48 12 Q56 14 52 24 Z" fill="#1A1A1A"/>
  <!-- 头盔眼部开口（刻线/镂空，显示陶土色） -->
  <path d="M36 48 Q42 46 50 50" stroke="#B0572A" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <!-- 头盔颊片刻线 -->
  <path d="M62 56 Q66 62 64 70" stroke="#B0572A" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <!-- 鼻梁护条刻线 -->
  <line x1="50" y1="40" x2="50" y2="58" stroke="#B0572A" stroke-width="1.6" stroke-linecap="round"/>
</svg>