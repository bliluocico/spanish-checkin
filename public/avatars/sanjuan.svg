  <line x1="60" y1="50" x2="60" y2="58" stroke="#B0572A" stroke-width="1" opacity="0.7"/>
  <!-- 海浪 -->
  <path d="M14 80 Q22 76 30 80 Q38 76 46 80 Q54 76 62 80 Q70 76 78 80 Q86 76 90 80" stroke="#1A1A1A" stroke-width="2.6" fill="none" stroke-linecap="round"/>
