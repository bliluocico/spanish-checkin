  <path d="M40 86 L44 18 L48 86 Z" fill="#1A1A1A"/>
  <path d="M52 86 L56 22 L60 86 Z" fill="#1A1A1A"/>
  <path d="M70 86 L74 32 L78 86 Z" fill="#1A1A1A"/>
  <!-- 塔身刻线（有机纹样） -->
  <line x1="26" y1="40" x2="26" y2="78" stroke="#B0572A" stroke-width="0.9" opacity="0.7"/>
  <line x1="44" y1="26" x2="44" y2="80" stroke="#B0572A" stroke-width="0.9" opacity="0.7"/>
  <line x1="56" y1="30" x2="56" y2="80" stroke="#B0572A" stroke-width="0.9" opacity="0.7"/>
  <line x1="74" y1="42" x2="74" y2="78" stroke="#B0572A" stroke-width="0.9" opacity="0.7"/>
  <!-- 顶端十字架 -->
  <rect x="43" y="4" width="2" height="14" fill="#1A1A1A"/>
  <rect x="40" y="9" width="8" height="2" fill="#1A1A1A"/>
