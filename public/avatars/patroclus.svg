<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 帕特罗克洛斯：胸甲 + 泪滴 -->
  <!-- 胸甲剪影 -->
  <path d="M30 30 Q30 22 50 22 Q70 22 70 30 L72 64 Q60 76 50 76 Q40 76 28 64 Z" fill="#1A1A1A"/>
  <!-- 胸甲中央肌肉刻线 -->
  <line x1="50" y1="30" x2="50" y2="64" stroke="#B0572A" stroke-width="1.4" stroke-linecap="round"/>
  <!-- 胸甲两侧肋刻线 -->
  <path d="M38 40 Q36 54 40 64 M62 40 Q64 54 60 64" stroke="#B0572A" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <!-- 肩甲刻线 -->
  <ellipse cx="36" cy="30" rx="5" ry="3" stroke="#B0572A" stroke-width="1.2" fill="none"/>
  <ellipse cx="64" cy="30" rx="5" ry="3" stroke="#B0572A" stroke-width="1.2" fill="none"/>
  <!-- 下眼泪滴 -->
  <path d="M50 84 Q46 80 50 76 Q54 80 50 84 Z" fill="#1A1A1A"/>
</svg>