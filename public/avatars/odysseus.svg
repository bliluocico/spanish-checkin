<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 奥德修斯：航海帽 + 弯弓 -->
  <!-- 弓身（黑剪影） -->
  <path d="M20 58 Q50 30 80 58" stroke="#1A1A1A" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <!-- 弓弦（细刻线） -->
  <line x1="20" y1="58" x2="80" y2="58" stroke="#B0572A" stroke-width="1.4" stroke-linecap="round"/>
  <!-- 航海帽（pileus 锥形帽剪影） -->
  <path d="M30 44 Q50 14 70 44 L66 48 L34 48 Z" fill="#1A1A1A"/>
  <!-- 箭（从弓中央射出） -->
  <line x1="50" y1="48" x2="50" y2="22" stroke="#1A1A1A" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M50 22 L47 18 L53 18 Z" fill="#1A1A1A"/>
  <!-- 帽顶刻线 -->
  <path d="M48 28 Q50 24 52 28" stroke="#B0572A" stroke-width="1.4" fill="none" stroke-linecap="round"/>
</svg>