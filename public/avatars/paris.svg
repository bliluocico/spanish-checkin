<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 帕里斯：弓 + 金苹果 -->
  <!-- 弓身 -->
  <path d="M22 56 Q42 30 62 56" stroke="#1A1A1A" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <!-- 弓弦 -->
  <line x1="22" y1="56" x2="62" y2="56" stroke="#B0572A" stroke-width="1.4" stroke-linecap="round"/>
  <!-- 箭朝下射向苹果 -->
  <line x1="42" y1="50" x2="50" y2="74" stroke="#1A1A1A" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M50 74 L46 78 L54 76 Z" fill="#1A1A1A"/>
  <!-- 金苹果（圆形，用刻线区分） -->
  <circle cx="58" cy="82" r="9" fill="#1A1A1A"/>
  <!-- 苹果叶柄刻线 -->
  <path d="M58 73 L58 70 L60 68" stroke="#B0572A" stroke-width="1.4" fill="none" stroke-linecap="round"/>
</svg>