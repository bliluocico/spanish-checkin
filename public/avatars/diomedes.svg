<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 狄俄墨得斯：狮盾 + 斜短矛 -->
  <!-- 盾牌主体 -->
  <circle cx="50" cy="60" r="28" fill="#1A1A1A"/>
  <!-- 盾内狮子轮廓（刻线） -->
  <circle cx="50" cy="60" r="20" stroke="#B0572A" stroke-width="1.4" fill="none" opacity="0.8"/>
  <!-- 狮子简化剪影：身躯 -->
  <path d="M40 66 Q44 54 56 56 Q60 60 54 68 Q46 70 40 66 Z" fill="#B0572A" opacity="0.55"/>
  <!-- 狮鬃毛刻线 -->
  <path d="M44 58 Q42 54 46 52 M48 56 Q48 52 52 53" stroke="#1A1A1A" stroke-width="1" fill="none" stroke-linecap="round"/>
  <!-- 斜短矛 -->
  <line x1="24" y1="34" x2="40" y2="20" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round"/>
  <!-- 矛头 -->
  <path d="M40 20 L36 16 L44 14 Z" fill="#1A1A1A"/>
</svg>