<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 布宜诺斯艾利斯：五月太阳 + 帆船 -->
  <!-- 太阳本体 -->
  <circle cx="50" cy="28" r="10" fill="#1A1A1A"/>
  <!-- 太阳放射光 -->
  <g stroke="#1A1A1A" stroke-width="2.4" stroke-linecap="round">
    <line x1="50" y1="10" x2="50" y2="6"/>
    <line x1="50" y1="46" x2="50" y2="50"/>
    <line x1="32" y1="28" x2="28" y2="28"/>
    <line x1="68" y1="28" x2="72" y2="28"/>
    <line x1="37" y1="15" x2="34" y2="12"/>
    <line x1="63" y1="15" x2="66" y2="12"/>
    <line x1="37" y1="41" x2="34" y2="44"/>
    <line x1="63" y1="41" x2="66" y2="44"/>
  </g>
  <!-- 太阳面刻线 -->
  <circle cx="50" cy="28" r="6" stroke="#B0572A" stroke-width="1.2" fill="none" opacity="0.75"/>
  <!-- 帆船船身 -->
  <path d="M22 74 L78 74 L70 84 L30 84 Z" fill="#1A1A1A"/>
  <!-- 帆 -->
  <path d="M50 72 L40 40 L60 40 Z" fill="#1A1A1A"/>
  <!-- 桅杆 -->
  <line x1="50" y1="74" x2="50" y2="34" stroke="#1A1A1A" stroke-width="2"/>
  <!-- 帆内刻线 -->
  <path d="M50 70 L46 44 L54 44" stroke="#B0572A" stroke-width="1" fill="none" opacity="0.7"/>
  <!-- 水波刻线 -->
  <path d="M22 88 Q26 86 30 88 Q34 86 38 88 Q42 86 46 88 Q50 86 54 88 Q58 86 62 88 Q66 86 70 88 Q74 86 78 88" stroke="#B0572A" stroke-width="1.2" fill="none"/>
</svg>