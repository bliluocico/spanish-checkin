<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>徽章预览</title>
<style>
  body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; gap: 40px; background: #FFF8F0; flex-wrap: wrap; padding: 20px; }
  .card { background: white; border-radius: 24px; padding: 40px; text-align: center; box-shadow: 0 4px 20px rgba(255,123,123,0.12); }
  .title { font-size: 18px; font-weight: 700; margin-top: 16px; color: #4A3728; }
  .sub { font-size: 13px; color: #8B7355; margin-top: 4px; }
</style>
</head>
<body>

<!-- 塞万提斯 — 胜利 -->
<div class="card">
<svg width="120" height="120" viewBox="0 0 120 120">
  <circle cx="60" cy="60" r="56" fill="none" stroke="#4A6FA5" stroke-width="2.5"/>
  <circle cx="60" cy="60" r="48" fill="none" stroke="#4A6FA5" stroke-width="0.5" stroke-dasharray="3 3"/>
  <g transform="translate(52,62) rotate(-35)">
    <line x1="0" y1="14" x2="0" y2="-16" stroke="#4A6FA5" stroke-width="2" stroke-linecap="round"/>
    <path d="M 0,-16 C -7,-13 -10,-7 -3,-2 C -2,-1 0,-1 0,1 C 0,-1 2,-1 3,-2 C 10,-7 7,-13 0,-16 Z" fill="#4A6FA5" opacity="0.5"/>
    <polygon points="0,14 -2,19 0,22 2,19" fill="#4A6FA5" opacity="0.7"/>
  </g>
  <g transform="translate(68,62) rotate(35)">
    <line x1="0" y1="12" x2="0" y2="-16" stroke="#4A6FA5" stroke-width="3" stroke-linecap="round"/>
    <polygon points="0,-16 -3,-11 3,-11" fill="#4A6FA5"/>
    <line x1="-7" y1="7" x2="7" y2="7" stroke="#4A6FA5" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="7" x2="0" y2="12" stroke="#4A6FA5" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <circle cx="60" cy="62" r="4" fill="#4A6FA5" opacity="0.3"/>
  <text x="60" y="16" text-anchor="middle" fill="#4A6FA5" font-size="11" font-weight="700" letter-spacing="3">勒班陀</text>
</svg>
<div class="title">塞万提斯徽章</div>
<div class="sub">勒班陀的勇士 · 挑战胜利</div>
</div>

<!-- 博尔赫斯 — 平局 -->
<div class="card">
<svg width="120" height="120" viewBox="0 0 120 120">
  <circle cx="60" cy="60" r="56" fill="none" stroke="#8B6914" stroke-width="2.5"/>
  <circle cx="60" cy="60" r="52" fill="none" stroke="#8B6914" stroke-width="1.2" stroke-dasharray="0 60 130 0" stroke-dashoffset="0" transform="rotate(30 60 60)"/>
  <circle cx="60" cy="60" r="42" fill="none" stroke="#8B6914" stroke-width="1.2" stroke-dasharray="0 40 100 0" stroke-dashoffset="0" transform="rotate(-60 60 60)"/>
  <circle cx="60" cy="60" r="32" fill="none" stroke="#8B6914" stroke-width="1.2" stroke-dasharray="0 40 100 0" stroke-dashoffset="0" transform="rotate(90 60 60)"/>
  <circle cx="60" cy="60" r="22" fill="none" stroke="#8B6914" stroke-width="1.2" stroke-dasharray="0 30 80 0" stroke-dashoffset="0" transform="rotate(-30 60 60)"/>
  <circle cx="60" cy="60" r="4" fill="#8B6914" opacity="0.4"/>
  <text x="60" y="72" text-anchor="middle" fill="#8B6914" font-size="12" font-weight="700" letter-spacing="2">博尔赫斯</text>
</svg>
<div class="title">博尔赫斯徽章</div>
<div class="sub">迷宫中的同路人 · 共同完成</div>
</div>

<!-- 堂吉诃德 — 失败 -->
<div class="card">
<svg width="120" height="120" viewBox="0 0 120 120">
  <circle cx="60" cy="60" r="56" fill="none" stroke="#A0522D" stroke-width="2.5"/>
  <g transform="translate(48,50)">
    <circle cx="0" cy="0" r="4" fill="#A0522D" opacity="0.5"/>
    <line x1="0" y1="0" x2="0" y2="-18" stroke="#A0522D" stroke-width="2" stroke-linecap="round"/>
    <rect x="-4" y="-26" width="8" height="10" rx="1.5" fill="none" stroke="#A0522D" stroke-width="1.2" opacity="0.6"/>
    <line x1="0" y1="0" x2="0" y2="-18" stroke="#A0522D" stroke-width="2" stroke-linecap="round" transform="rotate(45)"/>
    <rect x="-4" y="-26" width="8" height="10" rx="1.5" fill="none" stroke="#A0522D" stroke-width="1.2" opacity="0.4" transform="rotate(45)"/>
    <line x1="0" y1="0" x2="0" y2="-18" stroke="#A0522D" stroke-width="2" stroke-linecap="round" transform="rotate(90)"/>
    <rect x="-4" y="-26" width="8" height="10" rx="1.5" fill="none" stroke="#A0522D" stroke-width="1.2" opacity="0.6" transform="rotate(90)"/>
    <line x1="0" y1="0" x2="0" y2="-18" stroke="#A0522D" stroke-width="2" stroke-linecap="round" transform="rotate(135)"/>
    <rect x="-4" y="-26" width="8" height="10" rx="1.5" fill="none" stroke="#A0522D" stroke-width="1.2" opacity="0.4" transform="rotate(135)"/>
    <line x1="0" y1="4" x2="0" y2="20" stroke="#A0522D" stroke-width="2"/>
    <line x1="-8" y1="20" x2="8" y2="20" stroke="#A0522D" stroke-width="1.5"/>
  </g>
  <g transform="translate(74,76) rotate(55)">
    <line x1="0" y1="0" x2="0" y2="-20" stroke="#A0522D" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="4" y1="3" x2="4" y2="13" stroke="#A0522D" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>
    <line x1="-1" y1="-1" x2="5" y2="2" stroke="#A0522D" stroke-width="1.5"/>
  </g>
  <text x="60" y="14" text-anchor="middle" fill="#A0522D" font-size="10" font-weight="700" letter-spacing="2">风车仍在转动</text>
  <text x="60" y="80" text-anchor="middle" fill="#A0522D" font-size="9" font-weight="600" letter-spacing="1">D. QUIJOTE</text>
</svg>
<div class="title">堂吉诃德徽章</div>
<div class="sub">风车骑士 · 挑战失败</div>
</div>

</body>
</html>
