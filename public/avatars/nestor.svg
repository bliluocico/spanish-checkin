<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 涅斯托尔：双耳酒杯 + 拐杖 -->
  <!-- 双耳酒杯剪影（kylix） -->
  <ellipse cx="46" cy="44" rx="18" ry="4.5" fill="#1A1A1A"/>
  <path d="M28 44 Q30 56 46 58 Q62 56 64 44" fill="#1A1A1A"/>
  <!-- 杯耳 -->
  <ellipse cx="28" cy="42" rx="6" ry="4" fill="none" stroke="#1A1A1A" stroke-width="2"/>
  <ellipse cx="64" cy="42" rx="6" ry="4" fill="none" stroke="#1A1A1A" stroke-width="2"/>
  <!-- 杯口刻线（液面） -->
  <ellipse cx="46" cy="44" rx="13" ry="2.5" stroke="#B0572A" stroke-width="1.2" fill="none"/>
  <!-- 杯柄 -->
  <rect x="44" y="58" width="4" height="12" fill="#1A1A1A"/>
  <ellipse cx="46" cy="72" rx="8" ry="3.5" fill="#1A1A1A"/>
  <!-- 拐杖（斜靠） -->
  <line x1="76" y1="92" x2="84" y2="20" stroke="#1A1A1A" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M84 20 Q88 16 84 12 Q80 14 82 18" stroke="#1A1A1A" stroke-width="2.6" fill="none" stroke-linecap="round"/>
</svg>